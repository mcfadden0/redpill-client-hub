<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#f5f3ed'><meta name='description' content='A coaching, nutrition and daily rhythm client hub from Red Pill LLC.'><link rel='manifest' href='./manifest.webmanifest'><link rel='apple-touch-icon' href='./icons/icon-192.png'><title>Red Pill Client Hub — Prototype</title><style>:root{--ink:#1d302b;--muted:#73807a;--paper:#f5f3ed;--card:#fffefa;--line:#e7e4dc;--green:#24483d;--mint:#dfece4;--coral:#d77a5e;--sand:#f2e8d9;--blue:#e7edf2;--shadow:0 14px 36px rgba(33,48,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1380px;margin:auto;min-height:100vh;padding:22px 30px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 0 22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:38px;height:38px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px}.brand-name{font-weight:750;letter-spacing:.01em}.brand-sub{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.top-right{display:flex;align-items:center;gap:12px}.demo-pill,.mode-btn{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--card);color:var(--ink);font-size:12px}.demo-pill{color:#8b634d;background:#fbf2e9}.mode-btn{font-weight:700}.layout{display:grid;grid-template-columns:218px minmax(0,1fr);gap:25px}.side{padding:17px 10px 18px 0}.client-switch{padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:20px}.client-switch small,.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:750}.client-switch strong{display:block;margin-top:4px;font-size:14px}.nav{display:grid;gap:5px}.nav button{display:flex;gap:11px;align-items:center;text-align:left;border:0;background:transparent;color:#68766f;padding:12px;border-radius:12px;font-weight:650}.nav button:hover,.nav button.active{background:#e7eee8;color:var(--green)}.nav-icon{font-size:17px;width:22px;text-align:center}.side-note{margin-top:24px;padding:14px;border-radius:15px;background:#eaf0e9;color:#486255;font-size:12px}.side-note strong{display:block;color:var(--green);margin-bottom:5px}.main{min-width:0}.page{display:none}.page.active{display:block}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:8px 0 22px}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,4vw,44px);line-height:1.04;letter-spacing:-.03em;margin:9px 0}.hero p{margin:0;color:var(--muted);max-width:620px}.hero-date{color:var(--muted);font-size:12px;white-space:nowrap;padding-bottom:5px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:var(--shadow)}.stat{min-height:123px;position:relative;overflow:hidden}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--mint)}.stat strong{display:block;font-size:27px;letter-spacing:-.03em;margin-top:12px}.stat small{color:var(--muted);font-size:11px}.columns{grid-template-columns:minmax(0,1.45fr) minmax(290px,.85fr)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.section-head h2,.card h2{font-size:17px;letter-spacing:-.02em;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.text-btn{border:0;background:none;color:var(--green);font-weight:750;font-size:12px;padding:6px}.macro-grid{display:grid;gap:12px}.macro-row{display:grid;grid-template-columns:78px 1fr 75px;gap:10px;align-items:center;font-size:12px}.macro-name{font-weight:700}.macro-numbers{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.bar{height:8px;background:#eeede7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}.bar.coral i{background:var(--coral)}.bar.blue i{background:#7c98aa}.disclaimer{color:var(--muted);font-size:10px;margin:13px 0 0}.meal-list{display:grid;gap:10px}.meal-row{display:grid;grid-template-columns:43px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px;border-radius:14px;border:1px solid var(--line);background:#fff}.meal-emoji{width:42px;height:42px;border-radius:13px;background:var(--sand);display:grid;place-items:center;font-size:19px}.meal-title{font-weight:730;font-size:13px}.meal-meta{font-size:11px;color:var(--muted);margin-top:2px}.done-chip{font-size:10px;padding:6px 9px;border-radius:999px;background:#eff0ec;color:#727c75}.done-chip.done{background:var(--mint);color:var(--green)}.checklist{display:grid;gap:9px;margin-top:15px}.habit{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font-size:12px}.habit input{accent-color:var(--green);width:16px;height:16px}.meal-prep{background:#f7eee7;border:1px solid #f0dfd0;border-radius:18px;padding:17px;margin-top:15px}.meal-prep h3{margin:0 0 5px;font-size:14px}.meal-prep p{font-size:12px;color:#73675e;margin:0 0 12px}.pill-btn,.primary-btn,.secondary-btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750;font-size:12px}.primary-btn{background:var(--green);color:#fff}.secondary-btn{background:#e9eee9;color:var(--green)}.pill-btn{background:#fffefa;border:1px solid var(--line);color:var(--green)}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.callout{border-radius:17px;padding:17px;background:#e9f0eb;color:#476052}.callout strong{display:block;margin-bottom:5px;color:var(--green)}.callout p{font-size:12px;margin:0}.meal-detail{margin-top:12px}.meal-detail details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px}.meal-detail summary{cursor:pointer;font-weight:750;display:flex;justify-content:space-between}.meal-detail p,.meal-detail li{font-size:12px;color:var(--muted)}.meal-detail ul{padding-left:18px}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#edf1ec;color:var(--green);padding:5px 9px;font-size:10px;font-weight:750}.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:15px 3px 0;border-bottom:1px solid var(--line)}.chart-col{flex:1;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;gap:8px;height:100%;font-size:10px;color:var(--muted)}.chart-bar{width:min(34px,70%);border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#6b927e,#bcd3c4);min-height:12px}.metric-grid{grid-template-columns:repeat(3,1fr)}.metric{padding:14px;border-radius:14px;background:#f3f4ef}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{font-size:20px;display:block;margin:5px 0}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fffefa;color:var(--ink)}.field textarea{min-height:82px;resize:vertical}.form-note{font-size:11px;color:var(--muted)}.session-card{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.session-card strong{display:block;font-size:13px}.session-card small{color:var(--muted)}.coach-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--green);color:#fff;border-radius:20px;padding:23px;margin:8px 0 15px}.coach-banner h2{font-family:Georgia,serif;font-size:28px;margin:5px 0}.coach-banner p{font-size:12px;color:#d6e5dc;margin:0;max-width:550px}.coach-banner .eyebrow{color:#bbd1c3}.client-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.avatar{width:40px;height:40px;background:var(--sand);border-radius:50%;display:grid;place-items:center;font-weight:800}.client-row:last-child{border:0}.client-row strong{display:block;font-size:13px}.client-row small{font-size:11px;color:var(--muted)}.right{margin-left:auto}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;background:#f7f6f1;border-radius:14px}.footer-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1d302b;color:white;border-radius:12px;padding:12px 16px;font-size:12px;box-shadow:var(--shadow);transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-nav{display:none}.smallcaps{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.warning{background:#fbf4e8;border:1px solid #f0e1c8;color:#746246;border-radius:13px;padding:12px;font-size:11px;margin-top:12px}@media(max-width:960px){.shell{padding:18px}.layout{grid-template-columns:175px minmax(0,1fr);gap:18px}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:680px){.shell{padding:12px 13px 88px}.topbar{padding:3px 1px 14px}.demo-pill{display:none}.layout{display:block}.side{display:none}.hero{display:block;margin:10px 2px 17px}.hero-date{margin-top:10px}.stats{gap:9px}.stat{padding:13px;min-height:108px}.stat strong{font-size:23px}.card{padding:15px;border-radius:16px}.two{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr 1fr}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;background:rgba(255,254,250,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);grid-template-columns:repeat(4,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:4}.mobile-nav button{border:0;background:none;color:#718078;font-size:10px;padding:5px 2px}.mobile-nav button span{display:block;font-size:17px;margin-bottom:2px}.mobile-nav button.active{color:var(--green);font-weight:800}.coach-banner{display:block}.coach-banner .primary-btn{margin-top:14px}.form-row{grid-template-columns:1fr}.hero h1{font-size:35px}.mode-btn{padding:8px 10px}.brand-sub{font-size:9px}}</style></head><body><div class='shell'><header class='topbar'><div class='brand'><div class='mark'>R</div><div><div class='brand-name'>RED PILL <span style='font-weight:450;color:var(--muted)'>CLIENT HUB</span></div><span class='brand-sub'>coaching · nutrition · daily rhythm</span></div></div><div class='top-right'><a class='mode-btn' href='https://theredpillllc.com' target='_blank' rel='noopener' style='text-decoration:none'>Visit website ↗</a><span class='demo-pill'>WORKING PROTOTYPE · DEMO DATA</span><button class='mode-btn' id='installButton' style='display:none'>Install app</button><button class='mode-btn' id='modeButton'>Switch to Coach view</button></div></header><div class='layout'><aside class='side'><div class='client-switch'><small id='roleLabel'>CLIENT SPACE</small><strong id='userName'>Jordan · Demo Client</strong></div><nav class='nav' id='sideNav'><button class='active' data-view='today'><span class='nav-icon'>⌂</span>Today</button><button data-view='meals'><span class='nav-icon'>◒</span>Meals</button><button data-view='progress'><span class='nav-icon'>↗</span>Progress</button><button data-view='sessions'><span class='nav-icon'>▦</span>Meet with Avery</button><button data-view='coach' class='coach-only' style='display:none'><span class='nav-icon'>◎</span>Coach overview</button></nav><div class='side-note'><strong>Built around your real life</strong>Small daily check-ins help Avery tailor coaching and meal support over time.</div></aside><main class='main' id='content'></main></div><nav class='mobile-nav' id='mobileNav'><button class='active' data-view='today'><span>⌂</span>Today</button><button data-view='meals'><span>◒</span>Meals</button><button data-view='progress'><span>↗</span>Progress</button><button data-view='sessions'><span>▦</span>Sessions</button></nav></div><div class='toast' id='toast'></div><script>const seed={mode:'client',view:'today',energy:3,sleep:7.1,cycleOptIn:false,request:null,habits:{water:true,stretch:true,walk:false,prep:false},meals:[{name:'Greek yogurt oats',slot:'Breakfast · 7:30 AM',icon:'🥣',protein:28,carbs:48,fat:12,done:true,ingredients:['Rolled oats','Greek yogurt','Berries','Chia seeds'],why:'A filling start with protein and fiber. Ingredient values and portions are estimates.'},{name:'Chicken quinoa bowl',slot:'Lunch · 12:30 PM',icon:'🥗',protein:36,carbs:52,fat:14,done:true,ingredients:['Chicken','Quinoa','Roasted vegetables','Olive oil dressing'],why:'A balanced meal with a clear protein source and carbohydrates for the day.'},{name:'Beef and lentil chili',slot:'Dinner · planned',icon:'🍲',protein:32,carbs:44,fat:16,done:false,ingredients:['Lean beef','Lentils','Tomatoes','Beans','Spices'],why:'This meal contributes protein and dietary iron. This is nutrient context, not cycle-specific medical advice.'},{name:'Snack and shake',slot:'Flexible · planned',icon:'🍌',protein:22,carbs:24,fat:5,done:false,ingredients:['Protein shake','Banana'],why:'A convenient option when it fits the client-set plan and appetite.'}]};let saved;try{saved=JSON.parse(localStorage.getItem('rp-client-hub-demo')||'null')}catch(e){saved=null}let state=Object.assign({},seed,saved||{});if(saved&&saved.habits)state.habits=Object.assign({},seed.habits,saved.habits);if(!saved||!Array.isArray(state.meals))state.meals=seed.meals;const root=document.querySelector('#content');const macroTargets={protein:120,carbs:180,fat:60};function save(){localStorage.setItem('rp-client-hub-demo',JSON.stringify(state));render()}function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function sums(){return state.meals.filter(m=>m.done).reduce((a,m)=>({protein:a.protein+m.protein,carbs:a.carbs+m.carbs,fat:a.fat+m.fat}),{protein:0,carbs:0,fat:0})}function pct(n,t){return Math.min(100,Math.round(n/t*100))}function macroCard(){const s=sums();return `<div class='card'><div class='section-head'><div><h2>Today’s macro snapshot</h2><p>Sample targets set by the coach · demo only</p></div><span class='tag'>↗ Daily view</span></div><div class='macro-grid'>${[['protein','Protein',''],['carbs','Carbohydrates','coral'],['fat','Fat','blue']].map(([key,label,color])=>`<div class='macro-row'><span class='macro-name'>${label}</span><div class='bar ${color}'><i style='width:${pct(s[key],macroTargets[key])}%'></i></div><span class='macro-numbers'>${s[key]} / ${macroTargets[key]} g</span></div>`).join('')}</div><p class='disclaimer'>Estimates depend on ingredients and serving sizes. Your real targets should be set with Avery.</p></div>`}function mealRows(limit){return `<div class='meal-list'>${state.meals.slice(0,limit||state.meals.length).map((m,i)=>`<div class='meal-row'><div class='meal-emoji'>${m.icon}</div><div><div class='meal-title'>${m.name}</div><div class='meal-meta'>${m.slot} · ${m.protein}g protein</div></div><button class='done-chip ${m.done?'done':''}' data-action='meal' data-index='${i}'>${m.done?'Logged ✓':'Mark eaten'}</button></div>`).join('')}</div>`}function habitsBlock(){const labels={water:'Drink water with meals',stretch:'Morning mobility and stretch',walk:'Take a short walk',prep:'Prepare food or clothes for tomorrow'};return `<div class='checklist'>${Object.entries(labels).map(([key,label])=>`<label class='habit'><input type='checkbox' data-habit='${key}' ${state.habits[key]?'checked':''}><span>${label}</span></label>`).join('')}</div>`}function todayPage(){const s=sums();return `<section class='page active'><div class='hero'><div><div class='eyebrow'>TUESDAY · YOUR DAILY RHYTHM</div><h1>Good progress starts<br>with one useful choice.</h1><p>Your plan, meals, and check-ins in one calm place. Avery can use what you choose to log to guide your coaching.</p></div><div class='hero-date'>DEMO CLIENT VIEW</div></div><div class='grid stats'><div class='card stat'><div class='stat-top'>Sleep <span class='stat-icon'>☾</span></div><strong>${Number(state.sleep).toFixed(1)} <small>hrs</small></strong><small>Self-reported · last night</small></div><div class='card stat'><div class='stat-top'>Energy <span class='stat-icon'>✦</span></div><strong>${state.energy}<small> / 5</small></strong><small>Your check-in today</small></div><div class='card stat'><div class='stat-top'>Meals logged <span class='stat-icon'>◒</span></div><strong>${state.meals.filter(m=>m.done).length}<small> / ${state.meals.length}</small></strong><small>Update as your day goes</small></div><div class='card stat'><div class='stat-top'>Habits checked <span class='stat-icon'>✓</span></div><strong>${Object.values(state.habits).filter(Boolean).length}<small> / 4</small></strong><small>Progress, not perfection</small></div></div><div class='grid columns'><div class='grid'><div class='card'>${macroCard()}</div><div class='card'><div class='section-head'><div><h2>Today’s meals</h2><p>Tap a meal to mark it logged</p></div><button class='text-btn' data-view='meals'>View meal plan →</button></div>${mealRows(3)}</div></div><div class='grid'><div class='card'><div class='section-head'><div><h2>Daily habits</h2><p>Choose what you want to track</p></div><span class='tag'>${Object.values(state.habits).filter(Boolean).length} done</span></div>${habitsBlock()}</div><div class='meal-prep'><h3>Want hands-on meal prep?</h3><p>Ask Avery about an in-home meal-prep session in your area. In this pilot, availability is coordinated directly.</p><button class='pill-btn' data-view='sessions'>Ask about a visit</button></div></div></div><div class='footer-note'>Demo interface with fictional sample values. It does not diagnose, prescribe, or replace professional care.</div></section>`}function mealsPage(){return `<section class='page active'><div class='hero'><div><div class='eyebrow'>YOUR PLAN · SAMPLE CONTENT</div><h1>Meals with a reason.</h1><p>Each card shows what is in the meal and how it fits the plan. Nutrition numbers are estimates until connected to a verified food database and client-specific portions.</p></div></div>${macroCard()}<div class='meal-detail' style='margin-top:15px'>${state.meals.map((m,i)=>`<details><summary><span>${m.icon} &nbsp; ${m.name}</span><span class='tag'>${m.done?'Logged':'Planned'}</span></summary><p><strong>${m.slot}</strong> · Approx. ${m.protein}g protein · ${m.carbs}g carbs · ${m.fat}g fat</p><p><strong>Ingredients</strong></p><ul>${m.ingredients.map(x=>`<li>${x}</li>`).join('')}</ul><p><strong>Why it is here:</strong> ${m.why}</p><button class='secondary-btn' data-action='meal' data-index='${i}'>${m.done?'Undo log':'Mark as eaten'}</button></details>`).join('')}</div><div class='warning'>Cycle-related notes should be optional and informational. A food log can show nutrients and personal patterns; it cannot diagnose a deficiency or promise that a food will change cycle symptoms.</div></section>`}function progressPage(){const bars=[['M','6.6'],['T','7.1'],['W','6.8'],['T','7.4'],['F','6.9'],['S','7.8'],['S',String(Number(state.sleep).toFixed(1))]];return `<section class='page active'><div class='hero'><div><div class='eyebrow'>YOUR OWN PATTERNS</div><h1>Notice what supports you.</h1><p>Compare your self-reported sleep, habits, and check-ins over time. Trends are prompts for a coaching conversation—not proof of cause.</p></div></div><div class='grid two'><div class='card'><div class='section-head'><div><h2>Sleep · last 7 days</h2><p>Demo chart · replace with your entries</p></div><span class='tag'>Hours</span></div><div class='chart'>${bars.map(([day,val])=>`<div class='chart-col'><div class='chart-bar' style='height:${Number(val)/9*100}%'></div><span>${day}</span></div>`).join('')}</div><p class='disclaimer'>Sleep values shown here are fictional examples.</p></div><div class='card'><div class='section-head'><div><h2>Check in today</h2><p>Only share what is useful to you</p></div></div><div class='metric-grid'><div class='metric'><small>Sleep</small><strong>${Number(state.sleep).toFixed(1)}h</strong><small>hours</small></div><div class='metric'><small>Energy</small><strong>${state.energy}/5</strong><small>your rating</small></div><div class='metric'><small>Meals</small><strong>${state.meals.filter(m=>m.done).length}</strong><small>logged</small></div></div><div class='form-row'><div class='field'><label for='sleepInput'>Sleep last night (hours)</label><input id='sleepInput' type='number' min='0' max='24' step='.1' value='${state.sleep}'></div><div class='field'><label for='energyInput'>Energy today (1–5)</label><select id='energyInput'>${[1,2,3,4,5].map(n=>`<option value='${n}' ${Number(state.energy)===n?'selected':''}>${n} · ${['very low','low','steady','good','great'][n-1]}</option>`).join('')}</select></div></div><button class='primary-btn' data-action='save-checkin'>Save check-in</button></div></div><div class='card' style='margin-top:15px'><div class='section-head'><div><h2>Optional cycle tracking</h2><p>Private by choice; not required to use the app.</p></div><button class='secondary-btn' data-action='cycle'>${state.cycleOptIn?'Turn off':'Opt in'}</button></div><p class='form-note'>If enabled in a real product, you would choose what to record and who can see it. The app can show nutrient information and personal trends, but should not diagnose or infer a medical condition.</p></div></section>`}function sessionsPage(){const req=state.request?`<div class='session-card'><div><strong>Coaching check-in requested</strong><small>${state.request.date} · ${state.request.time} · Awaiting Avery’s confirmation</small></div><span class='tag'>Request sent</span></div>`:`<div class='empty'>No session booked yet. Send a preferred time and Avery can confirm it with you.</div>`;return `<section class='page active'><div class='hero'><div><div class='eyebrow'>STAY CONNECTED</div><h1>Make space for your check-in.</h1><p>Request your weekly one-on-one meeting. This prototype records a request locally; it does not connect to a live calendar.</p></div></div><div class='grid two'><div class='card'><h2>Weekly coaching session</h2>${req}<form id='bookingForm'><div class='form-row'><div class='field'><label for='dateInput'>Preferred date</label><input id='dateInput' type='date' required></div><div class='field'><label for='timeInput'>Preferred time</label><select id='timeInput'><option>9:00 AM</option><option>10:00 AM</option><option>12:00 PM</option><option>2:00 PM</option><option>4:00 PM</option></select></div></div><div class='field'><label for='agendaInput'>What would you like to focus on?</label><textarea id='agendaInput' placeholder='Meals, habits, questions, wins…'></textarea></div><button class='primary-btn' type='submit' style='margin-top:12px'>Request a time</button></form><p class='form-note'>Avery confirms the appointment directly. No payment or external scheduling is connected in this demo.</p></div><div class='card'><h2>In-home meal-prep support</h2><p class='form-note' style='line-height:1.7'>During the early pilot, Avery coordinates local visits directly. If you are interested, share your location and preferred days; you can discuss whether a visit fits your coaching plan.</p><div class='field' style='margin-top:16px'><label for='zipInput'>Your ZIP code (optional)</label><input id='zipInput' inputmode='numeric' placeholder='Enter ZIP to discuss local availability'></div><button class='secondary-btn' data-action='visit' style='margin-top:12px'>Ask Avery about a visit</button><div class='warning'>Local availability is confirmed personally. There is no staff marketplace in this version.</div></div></div></section>`}function coachPage(){const logged=state.meals.filter(m=>m.done).length;return `<section class='page active'><div class='coach-banner'><div><div class='eyebrow'>FOUNDER-LED PILOT · PRIVATE COACH VIEW</div><h2>Your coaching desk</h2><p>Review the client’s self-reported check-in, meal logs, and questions. In the current phase, you manage the relationship and any in-home visits directly.</p></div><button class='primary-btn' data-action='toast' data-message='Client invite flow is a next build step.'>Invite a client</button></div><div class='grid two'><div class='card'><div class='section-head'><div><h2>Client overview</h2><p>All sample data is fictional</p></div><span class='tag'>1 demo profile</span></div><div class='client-row'><div class='avatar'>J</div><div><strong>Jordan · Demo Client</strong><small>Last check-in: Today · ${logged} meals logged</small></div><span class='tag right'>Active</span></div><div class='metric-grid' style='margin-top:14px'><div class='metric'><small>Sleep</small><strong>${Number(state.sleep).toFixed(1)}h</strong><small>self-reported</small></div><div class='metric'><small>Energy</small><strong>${state.energy}/5</strong><small>today</small></div><div class='metric'><small>Meals</small><strong>${logged}/${state.meals.length}</strong><small>logged today</small></div></div><div class='warning'>Use trends to guide a conversation, not as a diagnosis. Confirm sensitive details directly with the client.</div></div><div class='card'><div class='section-head'><div><h2>Today’s coaching cues</h2><p>Starter checklist for your review</p></div></div><ul style='padding-left:19px;font-size:12px;color:#68766f;line-height:1.9'><li>Ask how the client felt after the logged meals.</li><li>Review sleep and habit check-in together.</li><li>Confirm the next weekly session.</li><li>Discuss any meal-prep visit directly during the pilot.</li></ul><button class='secondary-btn' data-view='sessions'>Open scheduling</button></div></div><div class='card' style='margin-top:15px'><div class='section-head'><div><h2>Build sequence</h2><p>Keep the first version focused on what you do now</p></div><span class='tag'>Now → later</span></div><div class='grid two'><div class='callout'><strong>Now · founder-led coaching</strong><p>Client intake, plan, meals, daily check-ins, progress conversation, and weekly appointment request.</p></div><div class='callout' style='background:#f5f0e8;color:#6c5a45'><strong style='color:#715b42'>Later · when local demand supports it</strong><p>Add staff schedules, visit assignment, training, and quality checks only after you are ready to hire.</p></div></div></div></section>`}function render(){document.body.classList.toggle('coach-mode',state.mode==='coach');document.querySelector('#modeButton').textContent=state.mode==='coach'?'Switch to Client view':'Switch to Coach view';document.querySelector('#roleLabel').textContent=state.mode==='coach'?'FOUNDER SPACE':'CLIENT SPACE';document.querySelector('#userName').textContent=state.mode==='coach'?'Avery · Coach':'Jordan · Demo Client';document.querySelectorAll('.coach-only').forEach(x=>x.style.display=state.mode==='coach'?'flex':'none');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));let html=state.mode==='coach'&&state.view==='coach'?coachPage():state.view==='meals'?mealsPage():state.view==='progress'?progressPage():state.view==='sessions'?sessionsPage():state.view==='coach'?coachPage():todayPage();root.innerHTML=html}document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;if(state.mode==='coach'&&state.view!=='coach'&&view.closest('#mobileNav'))state.mode='client';save();return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='meal'){const i=Number(b.dataset.index);state.meals[i].done=!state.meals[i].done;save()}else if(action==='cycle'){state.cycleOptIn=!state.cycleOptIn;save();toast(state.cycleOptIn?'Optional cycle tracking enabled in this demo':'Cycle tracking turned off')}else if(action==='save-checkin'){const sleep=Number(document.querySelector('#sleepInput').value);const energy=Number(document.querySelector('#energyInput').value);if(sleep>=0&&sleep<=24){state.sleep=sleep;state.energy=energy;save();toast('Check-in saved on this device')}else toast('Enter sleep hours from 0 to 24')}else if(action==='visit'){toast('Visit interest noted in this demo. Ask Avery directly to confirm local availability.')}else if(action==='toast'){toast(b.dataset.message)}else if(action==='reset'){localStorage.removeItem('rp-client-hub-demo');state=Object.assign({},seed,{habits:Object.assign({},seed.habits),meals:seed.meals.map(m=>Object.assign({},m))});save();toast('Demo data reset')}});document.addEventListener('change',e=>{if(e.target.matches('[data-habit]')){state.habits[e.target.dataset.habit]=e.target.checked;save()}});document.addEventListener('submit',e=>{if(e.target.id==='bookingForm'){e.preventDefault();const date=document.querySelector('#dateInput').value;if(!date){toast('Choose a preferred date first');return}state.request={date,time:document.querySelector('#timeInput').value};save();toast('Time request saved in this demo')}});document.querySelector('#modeButton').addEventListener('click',()=>{state.mode=state.mode==='coach'?'client':'coach';state.view=state.mode==='coach'?'coach':'today';save()});let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.querySelector('#installButton').style.display='inline-flex'});document.querySelector('#installButton').addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else toast('On Android, use the browser menu and choose Add to Home screen. For Google Play, the hosted site must be wrapped and verified.')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();</script></body></html>
